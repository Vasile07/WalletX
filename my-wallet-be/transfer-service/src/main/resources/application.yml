spring:
  application:
    name: transfer-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/walletx}
    username: ${DATABASE_USERNAME:walletx}
    password: ${DATABASE_PASSWORD:walletx}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        auto-startup: ${RABBITMQ_AUTO_STARTUP:true}
        default-requeue-rejected: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      enable-idempotence: true
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:walletx-transfer-audit}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.walletx.transferservice.messaging
        spring.json.value.default.type: com.walletx.transferservice.messaging.TransferKafkaMessage
walletx:
  jwt:
    secret: ${JWT_SECRET:}
  services:
    wallet:
      base-url: ${WALLET_SERVICE_URL:http://localhost:8082}
      internal-transfer-token: ${WALLET_INTERNAL_TRANSFER_TOKEN:}
server:
  port: 8083
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
