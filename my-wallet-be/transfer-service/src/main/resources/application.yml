spring:
  application:
    name: transfer-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/walletx}
    username: ${DATABASE_USERNAME:walletx}
    password: ${DATABASE_PASSWORD:walletx}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        auto-startup: ${RABBITMQ_AUTO_STARTUP:true}
        default-requeue-rejected: false
walletx:
  jwt:
    secret: ${JWT_SECRET:}
  services:
    wallet:
      base-url: ${WALLET_SERVICE_URL:http://localhost:8082}
      internal-transfer-token: ${WALLET_INTERNAL_TRANSFER_TOKEN:}
server:
  port: 8083
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
