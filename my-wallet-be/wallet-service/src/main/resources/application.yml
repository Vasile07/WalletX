spring:
  application:
    name: wallet-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/walletx_wallet}
    username: ${DATABASE_USERNAME:walletx}
    password: ${DATABASE_PASSWORD:walletx}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
server:
  port: 8082
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
walletx:
  jwt:
    secret: ${JWT_SECRET:}
  internal-transfer-token: ${WALLET_INTERNAL_TRANSFER_TOKEN:}
  low-balance-threshold: ${WALLET_LOW_BALANCE_THRESHOLD:100.00}
  notifications:
    gateway-url: ${NOTIFICATION_GATEWAY_URL:http://localhost:8080}
    internal-token: ${WALLET_LOW_BALANCE_NOTIFICATION_TOKEN:}
