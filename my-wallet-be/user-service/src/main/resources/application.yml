spring:
  application:
    name: user-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/walletx}
    username: ${DATABASE_USERNAME:walletx}
    password: ${DATABASE_PASSWORD:walletx}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
server:
  port: 8081
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
